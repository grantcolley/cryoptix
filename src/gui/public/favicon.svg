<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <style>
    .mark {
      fill: #242424;
      stroke: #242424;
    }
    @media (prefers-color-scheme: dark) {
      .mark {
        fill: #e7e7e7;
        stroke: #e7e7e7;
      }
    }
  </style>

  <!-- Outer segmented circle -->
  <path class="mark" fill="none" stroke-width="10" stroke-linecap="round"
        d="M84 18a66 66 0 1 1-44.8 17.5" />
  <path class="mark" fill="none" stroke-width="10" stroke-linecap="round"
        d="M112.5 25.5A66 66 0 0 1 143 75" />

  <!-- Candlestick lines -->
  <g class="mark" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M57 86V126" />
    <path d="M84 53V126" />
    <path d="M111 71V126" />
  </g>

  <!-- Candlestick bodies -->
  <g class="mark">
    <rect x="45" y="76" width="24" height="31" rx="3" />
    <rect x="72" y="62" width="24" height="30" rx="3" />
    <rect x="99" y="82" width="24" height="25" rx="3" />
  </g>
</svg>