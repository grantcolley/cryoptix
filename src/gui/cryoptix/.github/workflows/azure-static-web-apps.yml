name: Azure Static Web Apps

on:
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    env:
      VITE_AUTH_DOMAIN: ${{ secrets.VITE_AUTH_DOMAIN }}
      VITE_AUTH_CLIENT_ID: ${{ secrets.VITE_AUTH_CLIENT_ID }}
      VITE_AUTH_AUDIENCE: ${{ secrets.VITE_AUTH_AUDIENCE }}
      VITE_API_ROUTE_STATUS: ${{ secrets.VITE_API_ROUTE_STATUS }}
      VITE_API_ROUTE_START: ${{ secrets.VITE_API_ROUTE_START }}
      VITE_API_ROUTE_STOP: ${{ secrets.VITE_API_ROUTE_STOP }}
      VITE_API_ROUTE_UPDATE: ${{ secrets.VITE_API_ROUTE_UPDATE }}
      VITE_API_ROUTE_SUBSCRIBE: ${{ secrets.VITE_API_ROUTE_SUBSCRIBE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: /
          api_location: ""
          output_location: dist
          app_build_command: npm run build
